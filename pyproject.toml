[project]
name = "atelier"
version = "0.1.0"
description = "Turn Pinterest boards and floor plans into a design brief and a tiered shopping list"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8.3"]

[project.scripts]
atelier = "atelier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/atelier"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
# FastAPI's dependency-injection idiom puts calls in argument defaults on purpose.
flake8-bugbear.extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# The checker has to extend sys.path before it can import the package.
"scripts/check_retailers.py" = ["E402"]
